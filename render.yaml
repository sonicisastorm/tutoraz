services:
  - type: web
    name: tutoraz
    env: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: flask db upgrade && gunicorn run:app -c gunicorn.conf.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tutoraz-db
          property: connectionString

databases:
  - name: tutoraz-db
    plan: free
